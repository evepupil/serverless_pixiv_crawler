<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>素材审核</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Segoe UI", sans-serif; background: #f5f5f5; padding-bottom: 60px; }
.login { max-width: 320px; margin: 80px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
.login h2 { margin-bottom: 16px; }
.login input { width: 100%; padding: 8px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 4px; }
.btn { background: #07c160; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
.btn:hover { background: #06ad56; }
.btn-gray { background: #888; }
.btn-gray:hover { background: #777; }
.tabs { display: flex; background: #fff; border-bottom: 1px solid #ddd; }
.tab { padding: 12px 24px; cursor: pointer; border-bottom: 2px solid transparent; }
.tab.active { border-bottom-color: #07c160; font-weight: bold; }
.toolbar { padding: 12px; background: #fff; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
select { padding: 6px; border: 1px solid #ddd; border-radius: 4px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; padding: 12px; }
.card { background: #fff; border-radius: 8px; overflow: hidden; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.card img { width: 100%; height: 220px; object-fit: cover; display: block; background: #eee; }
.card .cb { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; accent-color: #07c160; }
.card .badge { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.6); color: #fff; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
.fixed-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; padding: 12px; text-align: right; border-top: 1px solid #ddd; display: flex; gap: 8px; justify-content: flex-end; }
.empty { text-align: center; padding: 40px; color: #888; }
.hint { font-size: 12px; color: #888; }
</style>
</head>
<body>
<div id="login" class="login">
  <h2>素材审核登录</h2>
  <input type="password" id="pwd" placeholder="审核密码" onkeydown="if(event.key==='Enter')login()">
  <button class="btn" onclick="login()">登录</button>
</div>

<div id="app" style="display:none">
  <div class="tabs">
    <div class="tab active" data-tab="review" onclick="switchTab('review')">审核</div>
    <div class="tab" data-tab="lib" onclick="switchTab('lib')">素材库</div>
  </div>
  <div class="toolbar">
    <select id="acct" onchange="load()"></select>
    <span id="st-filter" style="display:none">
      <label><input type="radio" name="st" value="approved" checked onchange="load()"> 已通过</label>
      <label><input type="radio" name="st" value="discarded" onchange="load()"> 已丢弃</label>
      <label><input type="radio" name="st" value="published" onchange="load()"> 已发布</label>
    </span>
    <span class="hint" id="hint"></span>
  </div>
  <div id="grid" class="grid"></div>
  <div class="fixed-bottom" id="actions"></div>
</div>

<script>
const API = location.origin;
function pwd(){ return localStorage.getItem('review_pwd') || ''; }
function h(){ return {'X-Review-Password': pwd(), 'Content-Type':'application/json'}; }
function login(){
  const p = document.getElementById('pwd').value;
  fetch(API+'/api/accounts', {headers:{'X-Review-Password': p}})
    .then(r => { if(!r.ok) throw 0; return r.json(); })
    .then(d => { localStorage.setItem('review_pwd', p); show(d.accounts||[]); })
    .catch(() => alert('密码错或服务不通'));
}
function show(accts){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  const s=document.getElementById('acct');
  s.innerHTML='';
  accts.forEach(a => { const o=document.createElement('option'); o.value=a.name; o.textContent=a.name; s.appendChild(o); });
  if(!accts.length) s.innerHTML='<option>(无账号)</option>';
  load();
}
let tab='review';
function switchTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.tab===t));
  document.getElementById('st-filter').style.display = t==='lib' ? '' : 'none';
  load();
}
function load(){
  const acct=document.getElementById('acct').value;
  const grid=document.getElementById('grid'); grid.innerHTML='';
  const acts=document.getElementById('actions'); acts.innerHTML='';
  document.getElementById('hint').textContent='';
  if(!acct){ grid.innerHTML='<div class="empty">无账号</div>'; return; }
  if(tab==='review'){
    fetch(API+'/api/review?account='+acct+'&limit=20', {headers:h()})
      .then(r=>r.json()).then(d => {
        const items=d.items||[];
        document.getElementById('hint').textContent = items.length ? `待审 ${items.length} 张(勾=丢弃,未勾=通过)` : '';
        if(!items.length){ grid.innerHTML='<div class="empty">没有待审,晚点再来</div>'; return; }
        items.forEach(it => grid.appendChild(card(it.pid, true)));
        acts.innerHTML = '<button class="btn" onclick="submitReview()">提交本批(未勾=通过,勾=丢弃)</button>';
      });
  } else {
    const st=document.querySelector('input[name=st]:checked').value;
    fetch(`${API}/api/material?account=${acct}&status=${st}`, {headers:h()})
      .then(r=>r.json()).then(d => {
        const items=d.items||[];
        document.getElementById('hint').textContent = `${st} ${items.length} 张` + (st==='published'?'(不可改)':'');
        if(!items.length){ grid.innerHTML='<div class="empty">空</div>'; return; }
        items.forEach(it => grid.appendChild(card(it.pid, st!=='published')));
        if(st!=='published'){
          acts.innerHTML = '<button class="btn-gray" onclick="mark(\'discard\')">标记丢弃(勾选)</button><button class="btn" onclick="mark(\'approve\')">标记通过(勾选)</button>';
        }
      });
  }
}
function card(pid, checkable){
  const d=document.createElement('div'); d.className='card';
  d.innerHTML = `<span class="badge">${pid}</span><img src="${API}/api/image?pid=${pid}&size=small" loading="lazy">`
    + (checkable ? `<input type="checkbox" class="cb" value="${pid}">` : '');
  return d;
}
function checked(){ return [...document.querySelectorAll('.cb:checked')].map(c => c.value); }
function allPids(){ return [...document.querySelectorAll('.cb')].map(c => c.value); }
function submitReview(){
  const acct=document.getElementById('acct').value;
  const all=allPids(); const chk=checked();
  const keep = all.filter(p => !chk.includes(p));  // 未勾=通过
  const discard = chk;                             // 勾=丢弃
  if(!all.length){ alert('没有待审'); return; }
  fetch(API+'/api/review', {method:'POST', headers:h(), body:JSON.stringify({account:acct, keep, discard})})
    .then(r=>r.json()).then(d => { alert(`通过 ${d.approved} 丢弃 ${d.discarded}`); load(); });
}
function mark(action){
  const acct=document.getElementById('acct').value;
  const chk=checked();
  if(!chk.length){ alert('没勾选'); return; }
  fetch(API+'/api/material/mark', {method:'POST', headers:h(), body:JSON.stringify({account:acct, action, pids:chk})})
    .then(r=>r.json()).then(d => { alert(`标记 ${d.marked} 张`); load(); });
}
if(pwd()){
  // 已登录过,直接拉 accounts
  fetch(API+'/api/accounts', {headers:h()}).then(r => r.ok ? r.json() : null).then(d => d && show(d.accounts||[])).catch(()=>{});
}
</script>
</body>
</html>
